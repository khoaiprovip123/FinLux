name: CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Test and Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore Firebase Configuration
        env:
          EMBEDDED_CONFIG_BASE64: ""
          EMBEDDED_DEBUG_KEYSTORE_BASE64: ""
          SECRET_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p gradle
          echo "$EMBEDDED_DEBUG_KEYSTORE_BASE64" | base64 -d > gradle/debug.keystore
          if [ -n "$SECRET_CONFIG" ]; then
            echo "Restoring google-services.json from GitHub secret..."
            echo "$SECRET_CONFIG" > app/google-services.json
          else
            echo "Restoring embedded google-services.json configuration..."
            echo "$EMBEDDED_CONFIG_BASE64" | base64 -d > app/google-services.json
          fi
          echo "Verified google-services.json restored: $(wc -c < app/google-services.json) bytes"
          echo "Verified gradle/debug.keystore restored: $(wc -c < gradle/debug.keystore) bytes"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
