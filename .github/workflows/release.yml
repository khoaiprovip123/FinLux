name: Tagged Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Firebase Configuration
        env:
          EMBEDDED_CONFIG_BASE64: ""
          EMBEDDED_DEBUG_KEYSTORE_BASE64: ""
          SECRET_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p gradle
          echo "$EMBEDDED_DEBUG_KEYSTORE_BASE64" | base64 -d > gradle/debug.keystore
          if [ -n "$SECRET_CONFIG" ]; then
            echo "Restoring google-services.json from GitHub secret..."
            echo "$SECRET_CONFIG" > app/google-services.json
          else
            echo "Restoring embedded google-services.json configuration..."
            echo "$EMBEDDED_CONFIG_BASE64" | base64 -d > app/google-services.json
          fi
          echo "Verified google-services.json restored: $(wc -c < app/google-services.json) bytes"
          echo "Verified gradle/debug.keystore restored: $(wc -c < gradle/debug.keystore) bytes"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract and Validate Version Info
        id: version_info
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | head -n 1 | tr -dc '0-9')
          EXPECTED_TAG="v${VERSION_NAME}"
          CURRENT_TAG="${GITHUB_REF_NAME}"

          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "TAG_NAME=${EXPECTED_TAG}" >> $GITHUB_ENV

          echo "Build Gradle Version: ${VERSION_NAME} (code: ${VERSION_CODE})"
          echo "Target Tag: ${EXPECTED_TAG}"

          # Version Guard for tag pushes
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ "${CURRENT_TAG}" != "${EXPECTED_TAG}" ]]; then
              echo "::error::Tag mismatch! Git tag is '${CURRENT_TAG}' but app/build.gradle.kts defines '${EXPECTED_TAG}'"
              exit 1
            fi
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Configure Release Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FINLUX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FINLUX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FINLUX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FINLUX_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Decoding private release keystore from GitHub secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "FINLUX_KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV
            echo "FINLUX_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> $GITHUB_ENV
            echo "FINLUX_KEY_ALIAS=${KEY_ALIAS}" >> $GITHUB_ENV
            echo "FINLUX_KEY_PASSWORD=${KEY_PASSWORD}" >> $GITHUB_ENV
            echo "HAS_RELEASE_KEY=true" >> $GITHUB_ENV
          else
            echo "GitHub release secrets not found. Generating release keystore on the fly..."
            keytool -genkeypair -v \
              -keystore /tmp/release.keystore \
              -alias finlux-release \
              -keypass finlux123456 \
              -storepass finlux123456 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=FinLux, OU=Mobile, O=FinLux, L=Hanoi, ST=Hanoi, C=VN"
            echo "FINLUX_KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV
            echo "FINLUX_KEYSTORE_PASSWORD=finlux123456" >> $GITHUB_ENV
            echo "FINLUX_KEY_ALIAS=finlux-release" >> $GITHUB_ENV
            echo "FINLUX_KEY_PASSWORD=finlux123456" >> $GITHUB_ENV
            echo "HAS_RELEASE_KEY=true" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Clean up Keystore Secret File
        if: always()
        run: |
          rm -f /tmp/release.keystore

      - name: Package Release Artifacts & Generate Checksums
        run: |
          mkdir -p release_artifacts
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          fi
          
          TARGET_APK="release_artifacts/FinLux-v${{ env.VERSION_NAME }}.apk"
          cp "$APK_SOURCE" "$TARGET_APK"
          
          # Generate SHA-256 Checksum
          cd release_artifacts
          SHA256_HASH=$(sha256sum "FinLux-v${{ env.VERSION_NAME }}.apk" | awk '{print $1}')
          echo "$SHA256_HASH  FinLux-v${{ env.VERSION_NAME }}.apk" > "FinLux-v${{ env.VERSION_NAME }}.apk.sha256"
          
          # Generate update.json for OTA verification
          cat <<EOF > update.json
          {
            "versionName": "${{ env.VERSION_NAME }}",
            "versionCode": ${{ env.VERSION_CODE }},
            "apkName": "FinLux-v${{ env.VERSION_NAME }}.apk",
            "sha256": "${SHA256_HASH}",
            "tag": "v${{ env.VERSION_NAME }}"
          }
          EOF
          cd ..
          
          echo "Generated SHA-256: ${SHA256_HASH}"
          cat release_artifacts/update.json

      - name: Extract Release Notes from CHANGELOG
        id: changelog
        run: |
          python3 -c "
          import re
          version = '${{ env.VERSION_NAME }}'
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = rf'## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
              else:
                  notes = f'FinLux v{version} official release.'
              with open('release_notes.txt', 'w', encoding='utf-8') as out:
                  out.write(notes)
          except Exception as e:
              with open('release_notes.txt', 'w', encoding='utf-8') as out:
                  out.write(f'FinLux v{version} official release.')
          "
          echo "Extracted release notes:"
          cat release_notes.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "FinLux v${{ env.VERSION_NAME }}"
          body_path: release_notes.txt
          draft: false
          prerelease: false
          files: |
            release_artifacts/FinLux-v${{ env.VERSION_NAME }}.apk
            release_artifacts/FinLux-v${{ env.VERSION_NAME }}.apk.sha256
            release_artifacts/update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
