name: Firebase CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firebase-ci.yml'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test-functions-and-rules:
    name: Functions & Rules Emulator Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Install Dependencies
        working-directory: ./functions
        run: npm ci

      - name: Build Functions
        working-directory: ./functions
        run: npm run build

      - name: Setup Java (for Firebase Emulator)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Emulator Tests (Pinned CLI)
        run: npx --prefix functions firebase emulators:exec --only firestore --project finlux-test "npm --prefix functions test"
